version: '3.9'

services:

  mariadb:
    image: mariadb:11

    container_name: folha_pgto_db

    restart: always

    environment:
      MARIADB_ROOT_PASSWORD: 123456
      MARIADB_DATABASE: folha_pagamento

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mariadb_data: